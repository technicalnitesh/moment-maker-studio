<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Particle Heart & Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030008;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        /* --- ROMANTIC PROPOSAL INTRO SCREEN --- */
        #proposal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #180022 0%, #030008 80%);
            transition: opacity 1s ease;
        }

        #proposal-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .floating-heart {
            font-size: 2rem;
            color: #ff1493;
            opacity: 0;
            animation: floatUp 4s infinite ease-in;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        #proposal-title {
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            color: #ff69b4;
            text-shadow: 0 0 15px #ff1493, 0 0 35px #ff1493;
            margin-bottom: 18px;
            letter-spacing: 1px;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        #proposal-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #ffd6ec;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.6;
            opacity: 0.9;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 15px #ff1493, 0 0 35px #ff1493; }
            50% { text-shadow: 0 0 25px #ff69b4, 0 0 55px #ff1493; }
        }

        .proposal-buttons {
            display: flex;
            gap: 25px;
        }

        #yes-btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.7);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #yes-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 20, 147, 1);
        }

        #no-btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            border: 2px solid #ff69b4;
            border-radius: 50px;
            background: transparent;
            color: #ff69b4;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="canvas-container"></div>

    <!-- Romantic Proposal Intro -->
    <div id="proposal-screen">
        <span class="floating-heart" style="left:20%; animation-delay:0s;">❤</span>
        <span class="floating-heart" style="left:75%; animation-delay:1.2s;">💕</span>
        <span class="floating-heart" style="left:50%; animation-delay:2.4s;">💖</span>

        <div id="proposal-title">Ek Sawaal Poochna Tha... 💌</div>
        <div id="proposal-subtitle">Tumhari muskurahat mera sukoon hai,<br>tumhara saath meri sabse pyari kahani...<br>Kya tum yeh chhota sa jaadu dekhna pasand karogi?</div>

        <div class="proposal-buttons">
            <button id="yes-btn">Haan, Dikhao ❤️</button>
            <button id="no-btn">Sochne do 🤔</button>
        </div>
    </div>

    <script>
        // --- 0. PROPOSAL INTRO INTERACTION ---
        const proposalScreen = document.getElementById('proposal-screen');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        // Playful "No" button that dodges away, encouraging them to pick Yes
        noBtn.addEventListener('mouseenter', () => {
            const x = (Math.random() - 0.5) * 220;
            const y = (Math.random() - 0.5) * 80;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        });

        yesBtn.addEventListener('click', () => {
            proposalScreen.classList.add('fade-out');
            setTimeout(() => {
                proposalScreen.style.display = 'none';
                startExperience();
            }, 1000);
        });

        // --- 1. MATRIX RAIN BACKGROUND ---
        const matrixCanvas = document.getElementById('matrix-canvas');
        const mCtx = matrixCanvas.getContext('2d');

        let mWidth = matrixCanvas.width = window.innerWidth;
        let mHeight = matrixCanvas.height = window.innerHeight;

        const chars = '0123456789♥♡LOVE';
        const fontSize = 16;
        let columns = Math.floor(mWidth / fontSize);
        let drops = Array(columns).fill(0).map(() => Math.random() * -50);

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(3, 0, 8, 0.15)';
            mCtx.fillRect(0, 0, mWidth, mHeight);

            mCtx.fillStyle = '#ff1493';
            mCtx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                mCtx.fillText(text, x, y);

                if (y > mHeight && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // --- 2. THREE.JS 3D PARTICLE SYSTEM ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const particleCount = 4000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 300;
            positions[i + 1] = (Math.random() - 0.5) * 300;
            positions[i + 2] = (Math.random() - 0.5) * 300;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Glow Texture for 3D Particles
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 105, 180, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 20, 147, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const material = new THREE.PointsMaterial({
            size: 2.5,
            map: createGlowTexture(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- 3. SHAPE GENERATORS ---
        function getOffscreenPoints(text, fontScale = 1) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 400;

            ctx.font = `bold ${Math.floor(80 * fontScale)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(text, 200, 200);

            const imgData = ctx.getImageData(0, 0, 400, 400);
            const points = [];

            for (let y = 0; y < 400; y += 3) {
                for (let x = 0; x < 400; x += 3) {
                    const idx = (y * 400 + x) * 4;
                    if (imgData.data[idx + 3] > 128) {
                        points.push({
                            x: (x - 200) * 0.35,
                            y: -(y - 200) * 0.35,
                            z: (Math.random() - 0.5) * 5
                        });
                    }
                }
            }
            return points;
        }

        function getHeartPoints() {
            const points = [];
            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                const scale = 2.2;

                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = (Math.random() - 0.5) * 10;

                points.push({ x: x * scale, y: y * scale, z: z });
            }

            // Overlay text inside heart center
            const textPoints = getOffscreenPoints('I Love You', 0.45);
            for (let i = 0; i < textPoints.length && i < points.length; i++) {
                points[i] = textPoints[i];
            }

            return points;
        }

        function setTargetShape(points) {
            for (let i = 0; i < particleCount; i++) {
                const p = points[i % points.length];
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }

        // --- 4. TIMELINE SEQUENCER ---
        const steps = [
            { text: '3', scale: 1.5, duration: 1200 },
            { text: '2', scale: 1.5, duration: 1200 },
            { text: '1', scale: 1.5, duration: 1200 },
            { text: 'You', scale: 1.1, duration: 1400 },
            { text: 'Are', scale: 1.1, duration: 1400 },
            { text: 'My', scale: 1.1, duration: 1400 },
            { text: 'Love', scale: 1.1, duration: 1600 },
            { heart: true, duration: 0 }
        ];

        let stepIndex = 0;
        let isHeartMode = false;

        function nextStep() {
            if (stepIndex >= steps.length) return;

            const step = steps[stepIndex];
            if (step.heart) {
                isHeartMode = true;
                setTargetShape(getHeartPoints());
            } else {
                setTargetShape(getOffscreenPoints(step.text, step.scale));
            }

            if (step.duration > 0) {
                setTimeout(() => {
                    stepIndex++;
                    nextStep();
                }, step.duration);
            }
        }

        // --- 5. RENDER & ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            drawMatrix();

            const posAttr = geometry.attributes.position;
            const posArray = posAttr.array;
            const speed = 0.08;

            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] += (targetPositions[i] - posArray[i]) * speed;
            }

            if (isHeartMode) {
                const time = clock.getElapsedTime();
                const pulse = 1 + Math.sin(time * 4) * 0.06;
                particleSystem.scale.set(pulse, pulse, pulse);
                particleSystem.rotation.y = Math.sin(time * 0.8) * 0.15;
            } else {
                particleSystem.rotation.y = Math.sin(clock.getElapsedTime()) * 0.05;
            }

            posAttr.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Starts the original particle sequence (called after "Yes" is clicked)
        function startExperience() {
            animate();
            setTimeout(nextStep, 500);
        }

        // Window Resize Handler
        window.addEventListener('resize', () => {
            mWidth = matrixCanvas.width = window.innerWidth;
            mHeight = matrixCanvas.height = window.innerHeight;
            columns = Math.floor(mWidth / fontSize);
            drops = Array(columns).fill(0).map(() => Math.random() * -50);

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
